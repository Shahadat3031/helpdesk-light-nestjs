apiVersion: apps/v1
kind: Deployment

metadata:
  name: helpdesk-light-nestjs-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: helpdesk-light-nestjs-app

  template:
    metadata:
      labels:
        app: helpdesk-light-nestjs-app

    spec:
      containers:
        - name: helpdesk-light-nestjs-app
          image: helpdesk-light-nestjs-app
          imagePullPolicy: Never

          ports:
            - containerPort: 3000


